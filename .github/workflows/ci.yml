name: CI

on:
  push:
    branches:
      - main
      - 'integrate/**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Code Quality / Linting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (ruff)
        run: uv run ruff check .

      - name: Automated Test Suite
        run: uv run pytest -v

      - name: Container build smoke test
        run: docker build -t pat-rag-test -f Containerfile .
